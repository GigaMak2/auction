services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: auction-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.2
    container_name: auction-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: auction-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  app:
    build: .
    container_name: auction-app
    ports:
      - "8080:8080"
      - "9001:9001"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
    healthcheck:
      test: "curl --fail --silent localhost:8080/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  notification:
    build: ../auction-notification
    container_name: auction-notification
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: auction-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--query.lookback-delta=15m'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      app:
        condition: service_healthy

  cloudwatch-exporter:
    image: prom/cloudwatch-exporter:latest
    container_name: auction-cloudwatch-exporter
    ports:
      - "9106:9106"
    volumes:
      - ./cloudwatch_exporter_config.yml:/config/config.yml
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - prometheus

  influxdb:
    image: influxdb:1.8
    container_name: auction-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: auction-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      influxdb:
        condition: service_started
      prometheus:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:9.3.3
    container_name: auction-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: true
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
      # elasticsearch가 쓸 수 있는 최대 ram을 2GB 로 한정
      ES_JAVA_OPTS: "-Xmx2g"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-nori ]; then
          bin/elasticsearch-plugin install analysis-nori --batch;
        fi &&
        /usr/local/bin/docker-entrypoint.sh
      "

  kibana:
    image: kibana:9.3.3
    container_name: auction-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://auction-elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: kibana
    command: >
      bash -c "
        curl -u elastic:${ELASTICSEARCH_PASSWORD} -X POST http://auction-elasticsearch:9200/_security/user/kibana_system/_password -H 'Content-Type: application/json' -d '{\"password\": \"kibana\"}' && /usr/local/bin/kibana-docker
      "
    depends_on:
      elasticsearch:
        condition: service_healthy

  k6:
    image: grafana/k6
    container_name: auction-k6
    volumes:
      - ./k6:/scripts
    command: run --out influxdb=http://auction-influxdb:8086/k6 /scripts/bid-test.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      influxdb:
        condition: service_started
      app:
        condition: service_healthy


volumes:
  postgres-data:
  influxdb-data:
  grafana-data:
  prometheus-data:
  elasticsearch-data:
