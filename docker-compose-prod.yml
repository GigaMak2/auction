# 실제 서버에서 들어가게될 docker compose file

services:
  spring:
    image: ${ECR_URI}
    container_name: auction-spring
    restart: on-failure:5
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
      - "9001:9001"

    healthcheck:
      test: "curl --fail --silent localhost:8080/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.6.2
    container_name: auction-redis
    restart: on-failure:5
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

