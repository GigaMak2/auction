spring:
  application:
    name: auction

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  profiles:
    include: oauth

  data:
    redis:
      #  redis에서 tls 연결을 사용할 경우 
      #
      #  data.redis.ssl.enabled=true
      #  data.redis.protocol=rediss
      #
      #  로 *둘다* 바꿔줘야 합니다.
      #  하나만 바꾸시면 안됩니다.
      #
      #  이는 저희가 lettuce와 redisson client를 둘다 쓰고 있고
      #  tls 적용 방법이 둘다 다르기 때문입니다.
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      protocol: ${REDIS_PROTOCOL:redis}
      host: ${REDIS_HOST:localhost}
      port: 6379

  ai:
    openai:
      chat:
        base-url: https://api.deepseek.com  # OpenAI 호환 엔드포인트 (DeepSeek V3)
        api-key: ${DEEPSEEK_API_KEY}
        options:
          model: deepseek-chat
      embedding:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY}
        options:
          model: text-embedding-3-small    # 텍스트 → 벡터 변환 전용 임베딩 모델 (RAG용)

  # Elasticsearch 관련
  elasticsearch:
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
    uris: ${ELASTICSEARCH_URIS}

  cloud:
    # AWS 관련
    aws:
      # 기본적으로 parameterstore는 비활성화
      parameterstore:
        enabled: false

  # 가상 스레드 관련
  threads:
    virtual:
      enabled: true

# actuator 관련
# 일단은 ALB나 ASG 를 위해서 health end point를 열어둡니다.
# 다른 정보들은 나중에 추가합시다.
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret:
    key: ${JWT_SECRET}
  accessExpire: 1800000
  refreshExpire: 604800000

scheduler:
  auction:
    delay: 60000  # 60초

admin:
  secret-key: ${ADMIN_SECRET_KEY}

