spring:
  application:
    name: auction

  profiles:
    include: oauth

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092

  ai:
    openai:
      chat:
        base-url: https://api.deepseek.com  # OpenAI 호환 엔드포인트 (DeepSeek V3)
        api-key: ${DEEPSEEK_API_KEY}
        options:
          model: deepseek-chat
      embedding:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY}
        options:
          model: text-embedding-3-small    # 텍스트 → 벡터 변환 전용 임베딩 모델 (RAG용)

jwt:
  secret:
    key: ${JWT_SECRET}
  accessExpire: 1800000
  refreshExpire: 604800000

scheduler:
  auction:
    delay: 60000  # 60초