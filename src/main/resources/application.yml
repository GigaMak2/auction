spring:
  application:
    name: auction
  autoconfigure:
    exclude:
    - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
    - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  profiles:
    include: oauth

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092

  ai:
    openai:
      chat:
        base-url: https://api.deepseek.com  # OpenAI 호환 엔드포인트 (DeepSeek V3)
        api-key: ${DEEPSEEK_API_KEY}
        options:
          model: deepseek-chat
      embedding:
        base-url: https://api.openai.com
        api-key: ${OPENAI_API_KEY}
        options:
          model: text-embedding-3-small    # 텍스트 → 벡터 변환 전용 임베딩 모델 (RAG용)

  cloud:
    # AWS 관련
    aws:
      # 기본적으로 parameterstore는 비활성화
      parameterstore:
        enabled: false

# actuator 관련
# 일단은 ALB나 ASG 를 위해서 health end point를 열어둡니다.
# 다른 정보들은 나중에 추가합시다.
management:
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      show-details: never

jwt:
  secret:
    key: ${JWT_SECRET}
  accessExpire: 1800000
  refreshExpire: 604800000

scheduler:
  auction:
    delay: 60000  # 60초
