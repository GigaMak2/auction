spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  cloud:
    aws:
      parameterstore:
        enabled: false
      region:
        static: ap-northeast-2

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
aws:
  eventbridge:
    lambda-arn: ${LAMBDA_ARN:}
    role-arn: ${ROLE_ARN:}
    legacy-lambda-arn: ${LEGACY_LAMBDA_ARN:}

management:
  server:
    port: 9001
    address: 0.0.0.0  # 모든 인터페이스 바인딩 — Docker 내부 및 호스트(9001:9001 매핑) 모두 접근 가능