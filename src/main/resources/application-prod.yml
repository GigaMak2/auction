spring:
  config:
    import: aws-parameterstore:/param/reverse-auction/prod/

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  cloud:
    # AWS 관련
    aws:
      # parameterstore 활성화
      parameterstore:
        enabled: true
      region:
        static: ap-northeast-2

  data:
    redis:
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
      protocol: ${REDIS_PROTOCOL:redis}
      host: ${REDIS_HOST:localhost}
      port: 6379
aws:
  eventbridge:
    lambda-arn: ${LAMBDA_ARN}
    role-arn: ${ROLE_ARN}
    legacy-lambda-arn: ${LEGACY_LAMBDA_ARN}

# actuator 관련
management:
  server:
    port: 9001
    address: 0.0.0.0  # ECS awsvpc — Prometheus 컨테이너가 별도 IP에서 접근하므로 필요
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
